---
name: "Sync kubernetes core images"

on:
  push:
    branches: [main]
    paths: ["images/kubernetes-core-images.md"]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: "Sync kubernetes core images"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Setup docker buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to aliyun"
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: "Sync kubernetes core images"
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
        working-directory: images
        shell: bash
        run: bash kubernetes-core-images.sh

      - name: "Verify changed files"
        id: changed
        uses: tj-actions/verify-changed-files@v20

      - name: "Commit and push changes"
        if: steps.changed.outputs.files_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: sync kubernetes core images by github actions [no ci]"
          commit_options: "--no-verify --signoff"
          file_pattern: "images/kubernetes-core-images.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
